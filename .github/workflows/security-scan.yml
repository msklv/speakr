# KCS/GH hardening: dependency + container/filesystem vulnerability scans that push
# SARIF to the Security tab. pip-audit for the Python dependency tree (direct +
# pinned transients via constraints.txt), Trivy fs for filesystem/Go-y sort.
name: security-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pip-audit:
    name: pip-audit (Python deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Audit dependencies
        run: |
          python -m pip install --no-cache-dir pip-audit
          # Audit direct requirements + constraints (wheel/jaraco.context pinned by CVE fix).
          # Exit 1 from pip-audit == findings (advisories found), not a crash.
          pip-audit -r requirements.txt -r constraints.txt

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  osv-scan:
    name: osv-scanner (OSV.dev)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      # osv-scanner-action's composite entry is not meant to be used directly;
      # invoke the official reusable workflow instead (self-uploads SARIF).
      - uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
        with:
          scan-args: |-
            --include-git-root
            -r
            ./