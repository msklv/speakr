# Build the hardened -lite image (LIGHTWEIGHT=1) from this branch and publish it
# to GHCR under the explicit tag 0.10.5-alpha-lite-fix. GHCR needs no extra
# secrets (uses GITHUB_TOKEN). Runs on native x64 runners (linux/amd64).
name: docker-build-lite-fix

on:
  push:
    branches: [hardening/0.10.5-alpha-lite]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push lite image (0.10.5-alpha-lite-fix)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:0.10.5-alpha-lite-fix
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:0.10.5-alpha-lite-fix2
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:0.10.5-alpha-lite-fix3
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:0.10.5-alpha-lite-fix4
          build-args: |
            PRODUCTION=1
            LIGHTWEIGHT=1