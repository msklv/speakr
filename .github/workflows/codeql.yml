# KCS/GH hardening: native GitHub static analysis (CodeQL).
# Category: free GH security stack. Tuned to repo conventions (checkout@v5).
name: codeql

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v5

      # Python extraction needs no build (no pyproject/setup.py in this repo), so
      # build-mode: none avoids autobuild trying to install deps and failing.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"